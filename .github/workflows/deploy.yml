name: Deploy docs

on:
  push:
    branches: [main]
  # Ascend fork: a fork starts with Actions disabled, so the push that would
  # have deployed can land before Actions is switched on and then never fire.
  # A manual trigger means the fork can always re-deploy without an empty commit.
  workflow_dispatch:
  workflow_call:
    inputs:
      snapshot_run_id:
        type: string
        default: ''
        required: false

permissions:
  contents: write
  actions: read

# Shared with the daily refresh: two `gh-deploy --force` runs at once would race
# to publish gh-pages.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          # Ascend fork: upstream deletes/renames Ops on its own schedule, and
          # docs/api/*.md still lists them, so tracking upstream HEAD turns any
          # upstream refactor into a build abort here -- caeb6c78 (2026-09-02,
          # "Remove legacy contiguous GQA and MHA Ops") did exactly that, and it
          # surfaced on an unrelated push. This fork's checkout moves when we
          # move it. See PROJECT_STATE 13.84.
          repository: yyttt6/TileOPs
          # Legacy API/design reference; measured 950 data is fetched separately.
          ref: 250b2be6447e8c2699940a176103929956b99daa
          path: TileOPs
          fetch-depth: 1
          sparse-checkout: |
            docs/design
            docs/perf
            src/tileops
            scripts/nightly_report.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-docs.txt
      - name: Fetch the dedicated remote nightly snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_RUN_ID: ${{ inputs.snapshot_run_id }}
        run: |
          python scripts/fetch_official_snapshot.py \
            --output "$RUNNER_TEMP/official-snapshot" --run-id "$SNAPSHOT_RUN_ID"
      # Failed data validation aborts deployment and preserves the live page.
      - name: Render eligible official performance data
        run: bash scripts/render_bench.sh
      - run: mkdocs gh-deploy --force
