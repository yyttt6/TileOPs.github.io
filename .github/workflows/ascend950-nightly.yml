name: Official Ascend 950 nightly

on:
  # Dispatched by tileops-nightly-dispatch.timer at 02:00 Asia/Shanghai.
  # GitHub scheduled events were repeatedly delayed by several hours.
  workflow_dispatch:
    inputs:
      operators:
        description: "Comma-separated operators for a bounded migration validation; all for nightly"
        default: all
        type: string
      validate_sources_only:
        description: "Validate contracts and source delivery without initializing the NPU"
        type: boolean
        default: false
      publish_snapshot_run_id:
        description: "Publish an existing validated snapshot without rerunning NPU measurements"
        required: false
        type: string
      resume_run_id:
        description: "Explicit prior run ID to resume (same source and measurement environment)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ascend950-official-nightly
  cancel-in-progress: false

jobs:
  contracts:
    if: github.repository == 'yyttt6/TileOPs.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yyttt6/TileOPs
          ref: ascend950-v0.1.0
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev -c constraints.txt
      - run: python scripts/ci/ascend950.py --phase cpu --output "$RUNNER_TEMP/official-950-contracts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-contracts
          overwrite: true
          path: ${{ runner.temp }}/official-950-contracts
          if-no-files-found: error

      - uses: actions/checkout@v4
        with:
          path: nightly-site-source
          persist-credentials: false
      - name: Package the exact sources for the device runner
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-sources"
          git archive --format=tar HEAD > "$RUNNER_TEMP/nightly-sources/tileops.tar"
          tar -rf "$RUNNER_TEMP/nightly-sources/tileops.tar" .git
          gzip "$RUNNER_TEMP/nightly-sources/tileops.tar"
          git -C nightly-site-source archive --format=tar.gz HEAD > "$RUNNER_TEMP/nightly-sources/site.tar.gz"
          cd "$RUNNER_TEMP/nightly-sources"
          sha256sum tileops.tar.gz site.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-sources
          path: ${{ runner.temp }}/nightly-sources
          if-no-files-found: error
          retention-days: 7

  benchmark:
    needs: contracts
    if: github.repository == 'yyttt6/TileOPs.github.io' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, ascend950-production, ascend950-server2]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 720
    env:
      http_proxy: http://127.0.0.1:15014
      https_proxy: http://127.0.0.1:15014
      no_proxy: localhost,127.0.0.1,::1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly-sources
          path: ${{ runner.temp }}/nightly-archives-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Unpack verified sources without GitHub git access on the device runner
        env:
          ARCHIVES: ${{ runner.temp }}/nightly-archives-${{ github.run_id }}-${{ github.run_attempt }}
          DESTINATION: ${{ runner.temp }}/nightly-v010-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cd "$ARCHIVES"
          sha256sum --check SHA256SUMS
          mkdir -p "$DESTINATION/measured-tileops"
          tar --no-same-owner -xzf site.tar.gz -C "$DESTINATION"
          tar --no-same-owner -xzf tileops.tar.gz -C "$DESTINATION/measured-tileops"
          test "$(git -C "$DESTINATION/measured-tileops" rev-parse HEAD)" = '${{ needs.contracts.outputs.source_commit }}'
          test -z "$(git -C "$DESTINATION/measured-tileops" status --porcelain)"
      - name: Preserve the previous validated snapshot as historical evidence
        if: inputs.validate_sources_only != true && inputs.publish_snapshot_run_id == ''
        working-directory: ${{ runner.temp }}/nightly-v010-source-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_official_snapshot.py --output previous-snapshot
      - name: Prepare canonical isolated environment and measure
        if: inputs.validate_sources_only != true && inputs.publish_snapshot_run_id == ''
        working-directory: ${{ runner.temp }}/nightly-v010-source-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          NIGHTLY_OPERATORS: ${{ inputs.operators || 'all' }}
        run: |
          set -eo pipefail
          mkdir -p /opt/tileops-ci/nightly-server2-20261103/evidence
          source /opt/tileops-ci/server2-20261030/config/prepare-python.sh "$PWD/measured-tileops"
          source /opt/tileops-ci/server2-20261030/config/toolchain-v1.env.sh
          export TILELANG_CACHE_DIR="$RUNNER_TEMP/nightly-${GITHUB_RUN_ID}-tilelang"
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4
          TORCH_DEVICE_BACKEND_AUTOLOAD=0 python /opt/tileops-ci/server2-20261030/config/check-toolchain-v1.py \
            --lock /opt/tileops-ci/server2-20261030/config/toolchain-v1.lock.json \
            --output "/opt/tileops-ci/nightly-server2-20261103/evidence/official-950-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-preflight.json"
          resume_args=()
          if [[ -n "$RESUME_RUN_ID" ]]; then
            [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
            resume_args=(--resume "/opt/tileops-ci/nightly-server2-20261103/evidence/official-950-${RESUME_RUN_ID}-1")
          fi
          python scripts/nightly_server2.py "${resume_args[@]}" \
            --source measured-tileops --previous-snapshot previous-snapshot --operators "$NIGHTLY_OPERATORS" \
            --output "/opt/tileops-ci/nightly-server2-20261103/evidence/official-950-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Recover an existing validated snapshot without device access
        if: inputs.publish_snapshot_run_id != ''
        working-directory: ${{ runner.temp }}/nightly-v010-source-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          SAVED_RUN: ${{ inputs.publish_snapshot_run_id }}
        run: |
          python scripts/recover_snapshot.py --run-id "$SAVED_RUN" \
            --output "/opt/tileops-ci/nightly-server2-20261103/evidence/official-950-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/snapshot"
      - name: Publish validated snapshot artifact
        if: inputs.validate_sources_only != true
        uses: actions/upload-artifact@v4
        with:
          name: ascend950-official-snapshot
          overwrite: true
          path: /opt/tileops-ci/nightly-server2-20261103/evidence/official-950-${{ github.run_id }}-${{ github.run_attempt }}/snapshot
          retention-days: 90
          if-no-files-found: error
      - name: Preserve raw evidence, including failed runs
        uses: actions/upload-artifact@v4
        if: always() && inputs.validate_sources_only != true && inputs.publish_snapshot_run_id == ''
        continue-on-error: true
        timeout-minutes: 20
        with:
          name: ascend950-raw-evidence
          overwrite: true
          path: |
            /opt/tileops-ci/nightly-server2-20261103/evidence/official-950-${{ github.run_id }}-${{ github.run_attempt }}
            /opt/tileops-ci/nightly-server2-20261103/evidence/official-950-${{ github.run_id }}-${{ github.run_attempt }}-preflight.json
          retention-days: 90
          if-no-files-found: error

  publish:
    if: inputs.validate_sources_only != true
    needs: benchmark
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      snapshot_run_id: ${{ github.run_id }}
